<header class="public-navbar sticky top-0 z-50 border-b border-brand-300/15 bg-[linear-gradient(100deg,rgba(5,6,13,.96),rgba(17,12,38,.94)_48%,rgba(6,19,28,.96))] text-white shadow-[0_10px_30px_rgba(5,6,13,.16),inset_0_1px_0_rgba(255,255,255,.05)] backdrop-blur-xl" [class.public-navbar--home]="homeOverlay">
  <div class="relative mx-auto flex h-[78px] max-w-[1800px] items-center justify-between px-4 sm:px-6 lg:h-[94px] lg:px-10 xl:px-12">
    <div class="flex min-w-0 items-center">
      <a routerLink="/" class="group flex shrink-0 items-center gap-3.5 rounded-xl focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-300">
        <span class="relative grid h-10 w-10 place-items-center rounded-xl bg-aurora text-[15px] font-black shadow-glow ring-1 ring-white/20">GE</span>
        <span class="leading-tight"><span class="block font-display text-[17px] font-bold tracking-tight text-white">GrowthifyEdge</span><span class="block text-[10px] font-bold uppercase tracking-[.18em] text-brand-300">Digital Solutions</span></span>
      </a>

      <nav class="ml-12 hidden items-center gap-9 xl:ml-14 xl:gap-10 lg:flex" aria-label="Primary navigation">
        @for (item of links; track item.path) {
          <a [routerLink]="item.path" routerLinkActive="text-white font-bold" [routerLinkActiveOptions]="{ exact: item.path === '/' }" class="group relative rounded-xl border border-transparent px-4 py-2.5 text-base font-semibold text-slate-400 transition duration-200 hover:border-white/15 hover:bg-[linear-gradient(110deg,rgba(109,73,255,.16),rgba(255,255,255,.06)_50%,rgba(54,224,200,.1))] hover:text-white hover:shadow-[inset_0_1px_0_rgba(255,255,255,.16),0_0_15px_rgba(109,73,255,.12)] focus:outline-none focus-visible:border-brand-300 focus-visible:text-white">
            {{ item.label }}
            <span class="pointer-events-none absolute inset-x-4 -bottom-px h-0.5 rounded-full bg-aurora opacity-0 shadow-glow transition-opacity duration-200 group-hover:opacity-100"></span>
          </a>
        }
      </nav>
    </div>

    <div class="hidden lg:block"><button type="button" class="ge-btn-aurora !min-h-[48px] !px-7 !py-3.5 text-[15px]" (click)="startProject()">Start a Project</button></div>
    <button type="button" class="grid h-10 w-10 place-items-center rounded-xl border border-white/15 bg-white/5 text-lg text-white transition hover:bg-white/10 focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-300 lg:hidden" (click)="toggleMobile()" [attr.aria-expanded]="mobileOpen()" aria-controls="public-mobile-nav" aria-label="Toggle navigation menu">☰</button>
  </div>

  @if (mobileOpen()) {
    <nav id="public-mobile-nav" class="border-t border-white/10 bg-ink-950/98 px-4 py-4 shadow-2xl lg:hidden" aria-label="Mobile navigation">
      <div class="mx-auto grid max-w-lg gap-1">
        @for (item of links; track item.path) {
          <a [routerLink]="item.path" routerLinkActive="bg-white/10 text-white" [routerLinkActiveOptions]="{ exact: item.path === '/' }" (click)="closeMobile()" class="rounded-xl px-4 py-3 text-sm font-semibold text-slate-300 transition hover:bg-white/10 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-300">{{ item.label }}</a>
        }
        <button type="button" class="ge-btn-aurora mt-2 w-full justify-center" (click)="startProject()">Start a Project</button>
      </div>
    </nav>
  }
</header>
